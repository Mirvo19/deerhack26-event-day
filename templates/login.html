<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in — DeerHack Live Control</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body>
<div class="admin-shell narrow">

  <section class="card" id="login-card">
    <div class="login-brand">
      <img src="/static/logo.svg" alt="DeerHack logo" />
      <div>
        <span class="badge">organizers only</span>
        <h1>DeerHack Live Control</h1>
      </div>
    </div>
    <p class="hint">Sign in with your organizer account. You will be redirected to /admin.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <div class="btn-row"><button type="submit" id="login-btn" style="flex:1">Sign in</button></div>
      <p class="hint error" id="login-err"></p>
    </form>
  </section>
</div>

<div class="toast" id="toast"></div>
<script src="/static/js/login.js"></script>
</body>
</html>
